# gqlgen configuration of the example. `go generate ./...` regenerates
# graph/generated.go from graph/*.graphqls.
schema:
  - graph/*.graphqls

exec:
  filename: graph/generated.go
  package: graph

model:
  filename: graph/model/models_gen.go
  package: model

resolver:
  layout: follow-schema
  dir: graph
  package: graph
  filename_template: "{name}.resolvers.go"

models:
  # From the contrib/gqlgen schema: the multipart Upload scalar and the
  # stored file.
  Upload:
    model: github.com/99designs/gqlgen/graphql.Upload
  StoredUpload:
    model: github.com/ubgo/filesystem/upload.Result
  # The app's own: a file as a records row.
  FileRecord:
    model: github.com/ubgo/filesystem/records.File
